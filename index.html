:root{
  --fs:28px;
  --ink:#0B2A4A; --grey:#4A6378; --line:#BAE4F0;
  --easy:#0091B9; --easyt:#E6F4FA; --easyd:#00708F;
  --medium:#FF6500; --mediumt:#FFF0E0; --mediumd:#B34700;
  --hard:#004E9B; --hardt:#E1ECF7; --hardd:#003A75;
  --display:"Outfit","Segoe UI Black","Arial Black","Segoe UI",Carlito,Calibri,system-ui,sans-serif;
  --body:"Figtree",Calibri,Carlito,"Segoe UI",Candara,"Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{background:#0091B9;min-height:100%}
body{margin:0;font-family:var(--body);font-weight:600;font-size:var(--fs);color:var(--ink);line-height:1.3;min-height:100vh;position:relative;
  padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(circle at 7% 22%, #BAE4F0 0, #FF6500 70px, transparent 71px),
    radial-gradient(circle at 94% 14%, #FFE27A 0, #FF6500 85px, transparent 86px),
    radial-gradient(circle at 88% 82%, #5FB8D6 0, #004E9B 130px, transparent 131px),
    radial-gradient(circle at 12% 88%, #5FB8D6 0, #004E9B 110px, transparent 111px),
    radial-gradient(circle at 48% 92%, #FFE27A 0, #FF6500 70px, transparent 71px),
    radial-gradient(circle at 78% 46%, #FFE27A 0, #FF6500 30px, transparent 31px),
    radial-gradient(circle at 55% 60%, rgba(255,255,255,.10) 0, rgba(255,255,255,.10) 240px, transparent 241px),
    radial-gradient(rgba(255,255,255,.45) 2.5px, transparent 3px),
    linear-gradient(135deg,#004E9B 0%,#0091B9 40%,#0091B9 80%,#BAE4F0 100%);
  background-size:auto,auto,auto,auto,auto,auto,auto,64px 64px,auto}
button{font:inherit;font-size:1em;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:5px solid #FFD500;outline-offset:3px}
button:disabled{opacity:.4;cursor:default}
.hidden{display:none!important}

/* ===== top bar ===== */
.top{position:sticky;top:0;z-index:10;padding:calc(.3em + env(safe-area-inset-top,0px)) .6em .3em;color:#fff;
  display:flex;align-items:center;gap:.5em;flex-wrap:wrap;
  background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-bottom:2px solid rgba(255,255,255,.35);box-shadow:0 8px 30px rgba(0,40,90,.18)}
.brand{display:flex;align-items:center;gap:.35em;margin-right:auto}
.logo{font-size:1.25em}
.top h1{margin:0;font-family:var(--display);font-weight:700;font-size:1.15em;text-shadow:0 3px 10px rgba(0,40,90,.25)}
.top h1 .the{background:#FF6500;padding:.02em .3em .08em;border-radius:6px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.top h1 .seat{color:#FFD500;text-shadow:0 3px 0 rgba(160,60,0,.35)}
.tbtn{min-height:64px;min-width:64px;padding:0 .55em;border-radius:14px;border:3px solid rgba(255,255,255,.6);background:rgba(255,255,255,.16);color:#fff;font-weight:800}
.tbtn[aria-pressed="true"]{background:#fff;color:#E05500;border-color:#fff}
.sizes{display:flex;gap:.25em}
.sizes .tbtn{font-family:var(--display);font-weight:700;padding:0 .35em}

main{max-width:1500px;margin:0 auto;padding:.8em .8em 2em}
.card{background:#fff;border-radius:26px;box-shadow:0 18px 40px rgba(0,40,90,.22);padding:.7em .8em .8em}
.stack{display:grid;gap:.8em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.8em}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.ct{font-family:var(--display);font-weight:700;margin:0 0 .45em;font-size:1em;color:var(--ink)}
.ct .n{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:50%;margin-right:.3em;
  background:linear-gradient(135deg,#FF8A00,#FF6500);color:#fff;font-size:.8em;vertical-align:.1em}
.opts{display:flex;flex-wrap:wrap;gap:.4em}
.opt{min-height:68px;padding:0 .8em;border-radius:999px;border:3px solid var(--line);background:#fff;font-weight:800;color:#004E9B}
.opt[aria-pressed="true"]{background:linear-gradient(135deg,#0091B9,#004E9B);color:#fff;border-color:transparent;box-shadow:0 8px 18px rgba(0,78,155,.3)}
.opt.lv-easy[aria-pressed="true"]{background:linear-gradient(135deg,#0091B9,#0091B9)}
.opt.lv-medium[aria-pressed="true"]{background:linear-gradient(135deg,#FF6500,#FFD500)}
.opt.lv-hard[aria-pressed="true"]{background:linear-gradient(135deg,#004E9B,#FF6500)}
.opt.lv-mixed[aria-pressed="true"]{background:linear-gradient(135deg,#0091B9,#FF6500 50%,#004E9B)}
.sub{color:var(--grey);font-size:.82em;margin:.45em 0 0;font-weight:700}
.letterset{font-family:var(--display);letter-spacing:.12em;color:#004E9B}
.go{min-height:84px;padding:0 1.1em;border:0;border-radius:999px;color:#fff;font-family:var(--display);font-weight:700;font-size:1.1em;
  background:linear-gradient(135deg,#FF8A00,#FF6500 50%,#0091B9);box-shadow:0 6px 0 #B34700,0 14px 28px rgba(255,101,0,.35)}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #B34700}
.plain{min-height:64px;padding:0 .8em;border-radius:999px;border:3px solid var(--line);background:#fff;font-weight:800;color:#004E9B}
.blue{min-height:64px;padding:0 .9em;border-radius:999px;border:0;color:#fff;font-weight:800;background:linear-gradient(135deg,#004E9B,#0091B9);box-shadow:0 5px 0 #003A75}
.startbar{display:flex;gap:.6em;justify-content:center;flex-wrap:wrap}

.stepper{display:inline-flex;align-items:center;gap:.25em;background:#E6F4FA;border-radius:16px;padding:.2em .3em}
.stepper button{width:64px;height:64px;border-radius:12px;border:3px solid var(--line);background:#fff;font-family:var(--display);font-weight:700;color:#004E9B}
.stepper .v{min-width:2em;text-align:center;font-family:var(--display);font-weight:700}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,11em),1fr));gap:.5em;margin-top:.6em}
.names{width:100%;margin-top:.5em;font:inherit;font-size:1em;font-weight:800;color:var(--ink);background:#F2FAFD;border:3px solid var(--line);border-radius:18px;padding:.35em .55em;min-height:6.5em;resize:vertical;line-height:1.35}
.names:focus-visible{outline:5px solid #FFD500;outline-offset:3px}
.tms.solo{grid-template-columns:repeat(auto-fill,minmax(min(100%,8em),1fr))}
.tms.solo .tm{min-height:84px}
.teamrow{display:flex;gap:.4em;align-items:center;border-radius:18px;padding:.25em .4em;background:#F2FAFD}
.sw{width:.9em;height:.9em;border-radius:50%;flex:none;box-shadow:0 0 0 3px #fff}
.teamrow input{flex:1;min-width:0;font:inherit;font-size:1em;font-weight:800;padding:.15em .45em;border:3px solid var(--line);border-radius:14px;color:var(--ink);min-height:60px;background:#fff}
.rules ol{margin:.2em 0 0;padding-left:1.4em}
.rules li{margin:.25em 0}
.count{color:#fff;text-align:center;font-weight:800;text-shadow:0 2px 6px rgba(0,40,90,.35);margin:0}

.lefthead{display:flex;align-items:center;justify-content:space-between;gap:.6em;flex-wrap:wrap}
.leftbar{height:.55em;border-radius:999px;background:#E6F4FA;margin:.55em 0 0;overflow:hidden}
.leftbar span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#FF8A00,#FF6500 55%,#0091B9);transition:width .4s}
.leftpill{display:inline-block;font-family:var(--body);font-weight:800;font-size:.62em;vertical-align:.2em;margin-left:.4em;padding:.1em .6em;border-radius:999px;background:#FFF0E0;color:#B34700}

/* ===== round ===== */
.roundtop{display:grid;grid-template-columns:auto 1fr auto;gap:.9em;align-items:center}
@media (max-width:900px){.roundtop{grid-template-columns:auto 1fr}.timerbox{grid-column:1 / -1;justify-self:center}}
.letter{width:1.45em;height:1.45em;font-size:3.6em;border-radius:.28em;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:700;color:#fff;line-height:1;
  background:linear-gradient(135deg,#FF8A00,#FF6500 55%,#0091B9);box-shadow:0 14px 30px rgba(0,78,155,.4), inset 0 -8px 0 rgba(0,0,0,.12)}
.letter.rolling{background:linear-gradient(135deg,#004E9B,#0091B9)}
.roundinfo h2{margin:0;font-family:var(--display);font-weight:700;font-size:1.05em}
.roundinfo p{margin:.2em 0 .5em;font-weight:700}
.roundinfo p b{font-family:var(--display);color:#FF6500;font-size:1.15em}
.btnrow{display:flex;flex-wrap:wrap;gap:.4em}
.timerbox{position:relative;width:4.2em;height:4.2em}
.timerbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.timerbox .track{stroke:#E6F4FA}
.timerbox .bar{stroke:url(#tg);transition:stroke-dashoffset .3s linear}
.timerbox .tt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:1.05em}
.timerbox .tt small{font-family:var(--body);font-size:.5em;color:var(--grey);font-weight:800}
.timerbox.low .tt{color:#E11D48}
.timesup{margin:.7em 0 0;text-align:center;font-family:var(--display);font-weight:700;font-size:1.3em;color:#fff;
  background:linear-gradient(135deg,#FF6500,#E11D48);border-radius:24px;padding:.3em .5em;box-shadow:0 14px 30px rgba(225,29,72,.35)}
.cats{list-style:none;margin:.8em 0 0;padding:0;display:grid;gap:.55em;grid-template-columns:repeat(auto-fill,minmax(min(100%,13em),1fr))}
.cat{background:#fff;border-radius:22px;box-shadow:0 12px 26px rgba(0,40,90,.2);display:flex;align-items:center;gap:.5em;padding:.45em .6em;
  border-left:12px solid var(--lc);min-height:2.6em}
.cat .num{flex:none;width:1.6em;height:1.6em;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:700;color:#fff;background:var(--lc);font-size:.85em}
.cat .txt{font-weight:800;line-height:1.2;flex:1}
.chip{flex:none;font-size:.62em;font-weight:800;border-radius:999px;padding:.1em .55em;background:var(--lt);color:var(--ld)}
.lv-easy{--lc:var(--easy);--lt:var(--easyt);--ld:var(--easyd)}
.lv-medium{--lc:var(--medium);--lt:var(--mediumt);--ld:var(--mediumd)}
.lv-hard{--lc:var(--hard);--lt:var(--hardt);--ld:var(--hardd)}

/* ===== check ===== */
.checkhead{display:flex;align-items:center;gap:.6em;flex-wrap:wrap;color:#fff;font-weight:800;text-shadow:0 2px 6px rgba(0,40,90,.35)}
.minil{width:1.6em;height:1.6em;font-size:1.3em;border-radius:.3em;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;color:#fff;
  background:linear-gradient(135deg,#FF8A00,#FF6500 55%,#0091B9);text-shadow:none;box-shadow:0 8px 18px rgba(0,78,155,.35)}
.bigcat{margin-top:.6em;position:relative;overflow:hidden;text-align:center;padding:.8em .8em 1em;border-top:14px solid var(--lc)}
.bigcat h2{margin:.25em 0 .1em;font-family:var(--display);font-weight:700;font-size:1.9em;line-height:1.15}
.bigcat p{margin:0;font-weight:800;color:var(--grey)}
.bigcat p b{font-family:var(--display);color:#FF6500;font-size:1.3em}
.bigcat .chip{font-size:.75em}
.tip{color:#fff;text-align:center;font-weight:800;text-shadow:0 2px 6px rgba(0,40,90,.35);margin:.7em 0}
.tms{display:grid;gap:.6em;grid-template-columns:repeat(auto-fill,minmax(min(100%,10em),1fr))}
.tm{min-height:96px;border-radius:24px;border:4px solid #fff;background:#fff;box-shadow:0 12px 26px rgba(0,40,90,.2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1em;padding:.3em;font-weight:800}
.tm .nm{display:flex;align-items:center;gap:.35em;font-family:var(--display);font-weight:700}
.tm .st{font-size:.75em;color:var(--grey)}
.tm[aria-pressed="true"]{background:linear-gradient(135deg,#16A34A,#4ADE80);color:#fff;border-color:#fff;box-shadow:0 12px 26px rgba(22,163,74,.4)}
.tm[aria-pressed="true"] .st{color:#fff}
.nav{display:flex;gap:.6em;justify-content:space-between;flex-wrap:wrap;margin-top:.8em}
.dots{display:flex;gap:.3em;justify-content:center;flex-wrap:wrap;margin-top:.7em}
.dots span{width:.55em;height:.55em;border-radius:50%;background:rgba(255,255,255,.5)}
.dots span.on{background:#fff;box-shadow:0 0 0 3px #FF6500}

/* ===== scores ===== */
.scorelist{display:grid;gap:.55em}
.srow{display:flex;align-items:center;gap:.6em;background:#fff;border-radius:24px;padding:.4em .7em;box-shadow:0 12px 26px rgba(0,40,90,.2)}
.srow.first{background:linear-gradient(135deg,#FFF8D6,#FFF1B8);box-shadow:0 14px 30px rgba(255,101,0,.35)}
.srow .rk{font-size:1.3em;width:1.6em;text-align:center;font-family:var(--display);font-weight:700}
.srow .nm{flex:1;font-family:var(--display);font-weight:700;display:flex;align-items:center;gap:.35em}
.srow .plus{font-weight:800;color:#16A34A}
.srow .tot{font-family:var(--display);font-weight:700;font-size:1.4em;min-width:2em;text-align:right}
.srow .adj{display:flex;gap:.25em}
.srow .adj button{width:56px;height:56px;border-radius:50%;border:3px solid var(--line);background:#fff;font-weight:800;color:#004E9B}

    var prev = S.round.cats, skip = {};
    prev.forEach(function(c){ skip[c.t] = 1; });
    markUsed(prev, false);
    var next = buildCats(skip);
    if(!next.length){ markUsed(prev, true); return; }
    markUsed(next, true);
    S.round.cats = next; S.round.marks = next.map(function(){ return []; });
    save(); renderRoundList(true); drawLeft();
  }
  function catWord(n){ return n + (n === 1 ? " category" : " categories"); }
  function drawLeft(){ var el = document.getElementById("leftNow"); if(el) el.textContent = catWord(leftNow()) + " left"; }
  function restartGame(){
    stopTimer();
    S.used = {}; S.recent = []; S.teams.concat(S.players).forEach(function(t){ t.score = 0; });
    S.roundNo = 0; S.round = null; S.last = null;
    save(); screen = "home"; render();
  }
  function teamPoints(){
    return P().map(function(_, t){
      return S.round.cats.reduce(function(n, _c, c){ return n + (S.round.marks[c] && S.round.marks[c][t] ? 1 : 0); }, 0);
    });
  }
  function finishRound(){
    var pts = teamPoints();
    P().forEach(function(tm, i){ tm.score += pts[i]; });
    S.last = {no: S.round.no, pts: pts};
    S.round.scored = true; stopTimer();
    screen = "scores"; save(); render(); chime();
  }

  /* ---------- render ---------- */
  var app = document.getElementById("app");
  function opt(act, val, label, on, cls){
    return '<button class="opt' + (cls ? " " + cls : "") + '" data-act="' + act + '" data-v="' + val + '" aria-pressed="' + (on ? "true" : "false") + '">' + label + "</button>";
  }
  function renderHome(){
    var lvls = ["easy", "medium", "hard"];
    var n = function(lv){ return CATS[lv].length + AU[lv].length; };
    var total = lvls.reduce(function(a, lv){ return a + n(lv); }, 0);
    var auTotal = lvls.reduce(function(a, lv){ return a + AU[lv].length; }, 0);
    var auHere = S.level === "mixed" ? auTotal : AU[S.level].length;
    var h = '<div class="stack">';
    h += '<p class="count">' + total + " categories: " + n("easy") + " easy, " + n("medium") + " medium and " + n("hard") + " hard. " + auTotal + " of them are about Australia 🇦🇺.</p>";
    h += '<div class="grid2">';
    h += '<div class="card"><h2 class="ct"><span class="n">1</span>Choose a level</h2><div class="opts">' +
      ["easy","medium","hard","mixed"].map(function(l){ return opt("level", l, LEVELS[l].name, S.level === l, "lv-" + l); }).join("") +
      '</div><p class="sub">' + LEVELS[S.level].desc + "</p>" +
      '<div class="opts" style="margin-top:.6em">' + opt("topic", "all", "🌏 All topics", S.topic === "all") + opt("topic", "au", "🇦🇺 Australia only", S.topic === "au") + "</div>" +
      '<p class="sub">' + (S.topic === "au" ? "Only categories about Australia and Sydney. There are " + auHere + " at this level." :
        "Australian categories are mixed in. They have a 🇦🇺 flag.") + "</p></div>";
    h += '<div class="card"><h2 class="ct"><span class="n">2</span>How many categories?</h2><div class="opts">' +
      [5, 8, 10, 12].map(function(n){ return opt("count", n, n, S.count === n); }).join("") +
      '</div><p class="sub">Students write one word for each category.</p></div>';
    h += '<div class="card"><h2 class="ct"><span class="n">3</span>How much time?</h2><div class="opts">' +
      [[60,"1 min"],[120,"2 min"],[180,"3 min"],[300,"5 min"],[0,"No timer"]].map(function(x){ return opt("time", x[0], x[1], S.time === x[0]); }).join("") +
      '</div><p class="sub">A sound plays at the end. The last 10 seconds beep.</p></div>';
    h += '<div class="card"><h2 class="ct"><span class="n">4</span>Which letters?</h2><div class="opts">' +
      [["auto","Best for the level"],["easy","Easy letters"],["most","Most letters"],["all","All letters"]].map(function(x){ return opt("letters", x[0], x[1], S.letters === x[0]); }).join("") +
      '</div><p class="sub">Letters used: <span class="letterset">' + letterSet() + "</span></p></div>";
    h += "</div>";
    h += '<div class="card"><h2 class="ct"><span class="n">5</span>Who is playing?</h2><div class="opts">' +
      opt("mode", "teams", "👥 Teams", S.mode !== "solo") + opt("mode", "solo", "🙋 Individuals", S.mode === "solo") + "</div>";
    if(S.mode === "solo"){
      h += '<p class="sub">Type each student\'s name on its own line. Each student plays alone and gets their own points.</p>' +
        '<textarea id="playersBox" class="names" rows="6" aria-label="Student names, one on each line" placeholder="One name on each line">' +
        esc(S.players.map(function(p){ return p.name; }).join("\n")) + "</textarea>" +
        '<p class="sub" id="playersCount">' + playersText() + "</p></div>";
    } else {
      h += '<div style="margin-top:.6em"><div class="stepper"><button data-act="teams" data-d="-1"' + (S.teams.length <= 0 ? " disabled" : "") + ' aria-label="Fewer teams">−</button>' +
        '<span class="v">' + S.teams.length + '</span><button data-act="teams" data-d="1"' + (S.teams.length >= 8 ? " disabled" : "") + ' aria-label="More teams">+</button></div>' +
        ' <span class="sub" style="display:inline">' + (S.teams.length ? "Tap a name to change it." : "No teams. You can play without points.") + "</span></div>" +
        '<div class="teams">' + S.teams.map(function(tm, i){
          return '<div class="teamrow"><span class="sw" style="background:' + col(i) + '"></span><input data-team="' + i + '" value="' + esc(tm.name) + '" maxlength="24" aria-label="Team ' + (i + 1) + ' name"></div>';
        }).join("") + "</div></div>";
    }
    var left = leftNow(), tot = totalNow(), pct = tot ? Math.round(left / tot * 100) : 0;
    h += '<div class="card leftcard"><div class="lefthead"><h2 class="ct" style="margin:0">🗂️ Categories left: ' + left + " of " + tot + "</h2>" +
      '<button class="plain" data-act="restart">' + (confirmNew ? "⚠️ Tap again to restart" : "🔄 Restart game") + "</button></div>" +
      '<div class="leftbar"><span style="width:' + pct + '%"></span></div>' +
      '<p class="sub">' + (left === 0 ? "⚠️ All categories here are used. Tap Restart game, or choose another level or topic." :
        left < S.count ? "Only " + left + " left. The next round will have " + catWord(left) + "." :
        "Each category is used once. Restart game puts them all back and clears the scores.") + "</p></div>";
    h += '<div class="startbar">';
    if(S.round && !S.round.scored) h += '<button class="blue" data-act="resume">▶ Back to round ' + S.round.no + "</button>";
    h += '<button class="go" data-act="start"' + (left ? "" : " disabled") + '>🎲 Start round ' + (S.roundNo + 1) + "!</button>";
    if(S.roundNo > 0) h += '<button class="plain" data-act="toScores">🏆 Scores</button>';
    h += "</div>";
    h += '<div class="card rules"><h2 class="ct">📋 How to play</h2><ol>' +
      (S.mode === "solo" ? "<li>Everyone plays alone. Each student needs paper and a pen.</li>" : "<li>Make teams. Each team needs paper and a pen.</li>") +
      "<li>Tap Start. You see a letter and a list of categories.</li>" +
      "<li>Write one word for each category. Every word starts with the letter.</li>" +
      "<li>Stop writing when the time ends.</li>" +
      (S.mode === "solo" ? "<li>Students read their answers. A good answer gets 1 point.</li>" +
        "<li>Two students have the same word? Nobody gets a point for it.</li></ol></div>"
      : "<li>Teams read their answers. A good answer gets 1 point.</li>" +
        "<li>Two teams have the same word? Nobody gets a point for it.</li></ol></div>");
    h += "</div>";
    app.innerHTML = h;
  }

  function renderRound(){
    var r = S.round, C = 2 * Math.PI * 45;
    var h = '<div class="card roundtop">' +
      '<div class="letter" id="letter">' + r.letter + "</div>" +
      '<div class="roundinfo"><h2>Round ' + r.no + ' <span class="leftpill" id="leftNow">' + catWord(leftNow()) + " left</span></h2>" +
      "<p>Write one word for each category. Every word starts with <b id=\"letterWord\">" + r.letter + "</b>.</p>" +
      '<div class="btnrow" id="roundBtns"></div></div>';
    if(S.time){
      h += '<div class="timerbox" id="timerbox"><svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="tg" x1="0" x2="1">' +
        '<stop offset="0" stop-color="#FF8A00"/><stop offset=".5" stop-color="#FF6500"/><stop offset="1" stop-color="#0091B9"/></linearGradient></defs>' +
        '<circle class="track" cx="50" cy="50" r="45" fill="none" stroke-width="10"/>' +
        '<circle class="bar" cx="50" cy="50" r="45" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + C + '"/></svg>' +
        '<div class="tt"><span class="tv">' + fmt(timer.left) + "</span><small>ready</small></div></div>";
    }
    h += "</div>";
    h += '<div class="timesup' + (S.time && timer.left <= 0 ? "" : " hidden") + '" id="timesup">⏰ Time is up! Pens down.</div>';
    h += '<ol class="cats" id="catList"></ol>';
    app.innerHTML = h;
    renderRoundList(false); drawRoundButtons(); drawTimer();
  }
  function renderRoundList(animate){
    var r = S.round, el = document.getElementById("catList"); if(!el) return;
    el.innerHTML = r.cats.map(function(c, i){
      return '<li class="cat lv-' + c.lv + (animate === false ? "" : " pop") + '" style="animation-delay:' + i * 45 + 'ms"><span class="num">' + (i + 1) + '</span><span class="txt">' + esc(c.t) +
        '</span><span class="chip">' + (c.au ? "🇦🇺 " : "") + LEVELS[c.lv].name + "</span></li>";
    }).join("");
  }
  function drawRoundButtons(){
    var el = document.getElementById("roundBtns"); if(!el) return;
    var h = "";
    if(S.time){
      if(timer.running) h += '<button class="plain" data-act="pause">⏸ Pause</button>';
      else if(timer.left > 0) h += '<button class="blue" data-act="play"' + (rolling ? " disabled" : "") + ">▶ " + (timer.left < S.time ? "Keep going" : "Start timer") + "</button>";
      h += '<button class="plain" data-act="add30"' + (rolling ? " disabled" : "") + ">+30 sec</button>";
    }
    h += '<button class="plain" data-act="newLetter"' + (rolling ? " disabled" : "") + ">🔤 New letter</button>";
    h += '<button class="plain" data-act="newList"' + (rolling ? " disabled" : "") + ">🔄 New list</button>";
    h += '<button class="go" data-act="check"' + (rolling ? " disabled" : "") + ' style="min-height:68px;font-size:1em">✅ Check answers</button>';
    h += '<button class="plain" data-act="home">🏠 Menu</button>';
    el.innerHTML = h;
  }

  function renderCheck(){
    var r = S.round, c = r.cats[ci], n = r.cats.length, marks = r.marks[ci] || [];
    var h = '<div class="checkhead"><span class="minil">' + r.letter + "</span><span>Round " + r.no + ". Category " + (ci + 1) + " of " + n + ".</span></div>";
    h += '<div class="card bigcat lv-' + c.lv + ' pop"><span class="chip">' + (c.au ? "🇦🇺 Australia. " : "") + LEVELS[c.lv].name + "</span><h2>" + esc(c.t) + "</h2><p>starting with <b>" + r.letter + "</b></p></div>";
    if(P().length){
      h += '<p class="tip">' + (S.mode === "solo" ? "Each student reads their answer. Tap a name to give 1 point." : "Each team reads its answer. Tap a team to give 1 point.") +
        '</p><div class="tms' + (S.mode === "solo" ? " solo" : "") + '">';
      P().forEach(function(tm, t){
        var on = !!marks[t];
        h += '<button class="tm" data-act="mark" data-t="' + t + '" aria-pressed="' + on + '"><span class="nm"><span class="sw" style="background:' + col(t) + '"></span>' + esc(tm.name) +
          '</span><span class="st">' + (on ? "✓ 1 point" : "Tap for 1 point") + "</span></button>";
      });
      h += "</div>";
    } else {
      h += '<p class="tip">Read your answers out loud. Is every word correct?</p>';
    }
    h += '<div class="dots">' + r.cats.map(function(_, i){ return '<span class="' + (i === ci ? "on" : "") + '"></span>'; }).join("") + "</div>";
    h += '<div class="nav"><button class="plain" data-act="prev"' + (ci === 0 ? " disabled" : "") + '>◀ Back</button>' +
      '<button class="plain" data-act="backRound">📝 See the list</button><button class="plain" data-act="home">🏠 Menu</button>';
    if(ci < n - 1) h += '<button class="blue" data-act="next">Next ▶</button>';
    else if(P().length) h += '<button class="go" data-act="finish" style="min-height:68px;font-size:1em">🏆 Add up the points</button>';
    else h += '<button class="go" data-act="start" style="min-height:68px;font-size:1em">🎲 Next round</button>';
    h += "</div>";
    app.innerHTML = h;
  }

  function renderScores(){
    var order = P().map(function(tm, i){ return {tm: tm, i: i}; }).sort(function(a, b){ return b.tm.score - a.tm.score; });
    var top = order.length ? order[0].tm.score : 0, medals = ["🥇","🥈","🥉"], rank = 0, prev = null;
    var h = '<div class="stack"><div class="card" style="text-align:center"><h2 class="ct" style="font-size:1.3em;margin:0">🏆 Scores after round ' + S.roundNo + "</h2></div>";
    if(!P().length) h += '<div class="card">' + (S.mode === "solo" ? "No student names in this game." : "No teams in this game.") + "</div>";
    h += '<div class="scorelist">';
    order.forEach(function(o, k){
      if(o.tm.score !== prev){ rank = k; prev = o.tm.score; }
      var plus = S.last && S.last.pts[o.i] !== undefined ? S.last.pts[o.i] : null;
      h += '<div class="srow pop' + (o.tm.score === top && top > 0 ? " first" : "") + '" style="animation-delay:' + k * 80 + 'ms">' +
        '<span class="rk">' + (medals[rank] || rank + 1) + '</span><span class="nm"><span class="sw" style="background:' + col(o.i) + '"></span>' + esc(o.tm.name) + "</span>" +
        (plus !== null ? '<span class="plus">+' + plus + " this round</span>" : "") +
        '<span class="adj"><button data-act="adj" data-t="' + o.i + '" data-d="-1" aria-label="Take away a point">−</button><button data-act="adj" data-t="' + o.i + '" data-d="1" aria-label="Add a point">+</button></span>' +
        '<span class="tot">' + o.tm.score + "</span></div>";
    });
    h += "</div>";
    h += '<div class="startbar"><button class="go" data-act="start">🎲 Next round!</button><button class="plain" data-act="home">🏠 Menu</button>' +
      '<button class="plain" data-act="restart">' + (confirmNew ? "⚠️ Tap again to restart" : "🔄 Restart game") + "</button></div>" +
      '<p class="count">' + catWord(leftNow()) + " left at this level. Restart game puts them all back and clears the scores.</p></div>";
    app.innerHTML = h;
  }

  function render(){
    document.documentElement.style.setProperty("--fs", S.size + "px");
    document.querySelectorAll("[data-size]").forEach(function(b){ b.setAttribute("aria-pressed", +b.dataset.size === S.size ? "true" : "false"); });
    document.getElementById("soundBtn").textContent = S.sound ? "🔊" : "🔇";
    if(screen === "round" && S.round) renderRound();
    else if(screen === "check" && S.round) renderCheck();
    else if(screen === "scores") renderScores();
    else { screen = "home"; renderHome(); }
    if(screen !== "round") window.scrollTo(0, 0);
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    var d = b.dataset, a = d.act;
    if(d.size){ S.size = +d.size; save(); render(); return; }
    if(a !== "restart") confirmNew = false;
    if(a === "sound"){ S.sound = !S.sound; save(); render(); if(S.sound) beep(660, .15); return; }
    if(a === "fs"){ window.__toggleFS(); return; }
    if(a === "level"){ S.level = d.v; save(); render(); return; }
    if(a === "topic"){ S.topic = d.v; save(); render(); return; }
    if(a === "count"){ S.count = +d.v; save(); render(); return; }
    if(a === "time"){ S.time = +d.v; save(); render(); return; }
    if(a === "letters"){ S.letters = d.v; save(); render(); return; }
    if(a === "mode"){
      S.mode = d.v; S.last = null;
      if(S.round) S.round.marks = S.round.cats.map(function(){ return []; });
      save(); render(); return;
    }
    if(a === "teams"){
      if(+d.d > 0 && S.teams.length < 8) S.teams.push({name: "Team " + (S.teams.length + 1), score: 0});
      if(+d.d < 0 && S.teams.length > 0) S.teams.pop();
      save(); render(); return;
    }
    if(a === "start"){ startRound(); return; }
    if(a === "resume"){ screen = "round"; render(); return; }
    if(a === "toScores"){ screen = "scores"; render(); return; }
    if(a === "home"){ pauseTimer(); screen = "home"; render(); return; }
    if(a === "play"){ startTimer(); return; }
    if(a === "pause"){ pauseTimer(); return; }
    if(a === "add30"){
      if(timer.running) timer.end += 30000; else timer.left += 30;
      if(timer.left > S.time && !timer.running){ /* allow going over the set time */ }
      var tu = document.getElementById("timesup"); if(tu) tu.classList.add("hidden");
      if(!timer.running) timer.left = Math.max(timer.left, 0);
      drawTimer(); drawRoundButtons(); return;
    }
    if(a === "newLetter"){ newLetter(); return; }
    if(a === "newList"){ newList(); return; }
    if(a === "check"){ pauseTimer(); screen = "check"; ci = 0; render(); return; }
    if(a === "backRound"){ screen = "round"; render(); return; }
    if(a === "prev"){ ci = Math.max(0, ci - 1); render(); return; }
    if(a === "next"){ ci = Math.min(S.round.cats.length - 1, ci + 1); render(); return; }
    if(a === "mark"){
      var m = S.round.marks[ci] = S.round.marks[ci] || [];
      m[+d.t] = !m[+d.t]; if(m[+d.t]) beep(880, .12, "triangle", .15);
      save(); render(); return;
    }
    if(a === "finish"){ finishRound(); return; }
    if(a === "adj"){ var tm = P()[+d.t]; tm.score = Math.max(0, tm.score + (+d.d)); save(); render(); return; }
    if(a === "restart"){
      if(!confirmNew){ confirmNew = true; render(); return; }
      confirmNew = false; restartGame(); return;
    }
  });
  function playersText(){
    var n = S.players.length;
    return n ? n + (n === 1 ? " student is playing." : " students are playing.") : "No names yet. You can also play without points.";
  }
  document.addEventListener("input", function(e){
    var t = e.target;
    if(t.id === "playersBox"){
      var old = {}; S.players.forEach(function(p){ old[p.name] = p.score; });
      var seen = {};
      S.players = t.value.split(/[\n,]+/).map(function(x){ return x.trim(); })
        .filter(function(x){ if(!x || seen[x]) return false; seen[x] = 1; return true; })
        .map(function(x){ return {name: x.slice(0, 24), score: old[x] || 0}; });
      if(S.round) S.round.marks = S.round.cats.map(function(){ return []; });
      save();
      var pc = document.getElementById("playersCount"); if(pc) pc.textContent = playersText();
      return;
    }
    if(t.dataset && t.dataset.team !== undefined){ S.teams[+t.dataset.team].name = t.value.trim() || ("Team " + (+t.dataset.team + 1)); save(); }
  });
  document.addEventListener("keydown", function(e){
    if(e.target.tagName === "INPUT") return;
    if(screen === "check"){
      if(e.key === "ArrowRight" && ci < S.round.cats.length - 1){ ci++; render(); }
      if(e.key === "ArrowLeft" && ci > 0){ ci--; render(); }
    }
  });

  load();
  render();
})();
</script>
<script>
/* full screen helper: works on desktop, Android and iPad (Safari), hides the button where full screen is not possible (iPhone) */
(function(){
  var d = document, el = d.documentElement;
  function canFS(){ return !!(d.fullscreenEnabled || d.webkitFullscreenEnabled) && !!(el.requestFullscreen || el.webkitRequestFullscreen); }
  window.__toggleFS = function(){
    try{
      if(!(d.fullscreenElement || d.webkitFullscreenElement)){
        var r = el.requestFullscreen ? el.requestFullscreen() : el.webkitRequestFullscreen();
        if(r && r.catch) r.catch(function(){});
      } else {
        var x = d.exitFullscreen ? d.exitFullscreen() : d.webkitExitFullscreen();
        if(x && x.catch) x.catch(function(){});
      }
    }catch(err){}
  };
  function hide(){ if(canFS()) return; d.querySelectorAll('[data-act="fs"],#fsBtn').forEach(function(b){ b.style.display = "none"; }); }
  hide();
  try{ new MutationObserver(hide).observe(d.body, {childList:true, subtree:true}); }catch(e){}
})();
</script>
<script>
/* toolkit home button: folder on a computer, same GitHub repository, or the teachers-toolkit repository */
(function(){
  var a = document.getElementById("toolkitHome"); if(!a) return;
  var REL = "Teachers_Toolkit_Home.html", REPOS = ["/teacherstoolkit/", "/teachers-toolkit/"];
  if(location.protocol === "file:"){ a.href = REL; return; }
  var gh = location.hostname.indexOf("github.io") > -1;
  a.href = gh ? REPOS[0] : REL;
  try{
    var head = function(u){ return fetch(u, {method:"HEAD", cache:"no-store"}).then(function(r){ return r.ok; }).catch(function(){ return false; }); };
    var tryAll = function(list, i){
      if(i >= list.length){ if(gh) a.href = REPOS[0]; return; }
      head(list[i]).then(function(y){ if(y) a.href = list[i]; else tryAll(list, i + 1); });
    };
    tryAll([REL].concat(REPOS), 0);
  }catch(e){}
})();
</script>
